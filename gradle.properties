# The build runs on an ARM64 laptop; AGP's own tools (aapt2, d8) are x64 and
# run under Prism emulation. Give the daemon enough heap that it does not
# thrash, but not so much that it competes with the emulator layer.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
